<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Painel · Betinho Barber Style</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Instrument+Serif:ital@0;1&family=Figtree:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="styles.css">
<style>
  html,body{margin:0}
  main{padding-block:32px 64px}
  .login{max-width:380px;margin:48px auto;display:grid;gap:14px}
  .login h1,.head h1{font-family:var(--f-display);font-weight:800;font-size:44px;text-transform:uppercase;line-height:.95}
  .login input,.tools input,.tools select{font:inherit;font-size:16px;color:var(--bone);background:var(--leather);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0}
  .login input:focus,.tools input:focus{outline:none;border-color:var(--brass)}
  .head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:12px;margin-bottom:20px}
  .tabs{display:flex;gap:6px;margin-bottom:20px}
  .tabs button{font:600 14px var(--f-body);padding:10px 16px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer}
  .tabs button[aria-selected="true"]{background:var(--brass);color:var(--brass-ink);border-color:var(--brass)}
  .tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
  .daynav{display:flex;align-items:center;gap:8px}
  .daynav strong{font-family:var(--f-display);font-size:26px;font-weight:800;text-transform:uppercase;min-width:220px;text-align:center}
  .list{display:grid;gap:10px}
  .bk{display:grid;grid-template-columns:72px 1fr auto;gap:14px;align-items:center;background:var(--leather-2);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
  @media (max-width:640px){.bk{grid-template-columns:60px 1fr}.bk .acts{grid-column:1/-1}}
  .bk .t{font-family:var(--f-mono);font-size:18px;color:var(--brass);font-variant-numeric:tabular-nums}
  .bk .who{min-width:0}
  .bk .who strong{display:block}
  .bk .who small{color:var(--muted);font-size:13px}
  .acts{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
  .pill{display:inline-block;font:500 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;border:1px solid var(--line);margin-left:6px;vertical-align:middle}
  .pill.pendente{color:#e6c07a;border-color:#6b5228}
  .pill.confirmado{color:#9fc3e8;border-color:#2f4a7a}
  .pill.concluido{color:var(--ok);border-color:#3d5a3a}
  .pill.faltou,.pill.cancelado{color:#e28a7e;border-color:#6b2f28}
  .bk.dim{opacity:.55}
  .empty{color:var(--muted);padding:24px 0}
  .tbl{overflow-x:auto}
  table.cl{width:100%;border-collapse:collapse;font-size:14px}
  table.cl th{text-align:left;font-family:var(--f-mono);font-weight:400;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:8px 8px 8px 0;border-bottom:1px solid var(--line)}
  table.cl td{padding:10px 8px 10px 0;border-bottom:1px dashed var(--line);white-space:nowrap}
  table.cl td.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
  .toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--bone);color:var(--leather);padding:10px 18px;border-radius:999px;font-weight:600;font-size:14px}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="mark" href="index.html">BETINHO<i>Barber Style</i></a>
    <button class="btn ghost" id="logout" type="button" hidden>Sair</button>
  </div>
</header>

<main class="wrap">
  <form class="login" id="loginForm" hidden novalidate>
    <p class="eyebrow">Área do barbeiro</p>
    <h1>Entrar</h1>
    <input id="email" type="email" autocomplete="username" placeholder="E-mail">
    <input id="senha" type="password" autocomplete="current-password" placeholder="Senha">
    <button class="btn" type="submit">Entrar</button>
    <p class="err" id="loginErr"></p>
  </form>

  <div id="app" hidden>
    <div class="head">
      <h1>Painel</h1>
      <div class="tabs" role="tablist">
        <button type="button" role="tab" aria-selected="true" data-tab="agenda">Agenda</button>
        <button type="button" role="tab" aria-selected="false" data-tab="clientes">Clientes</button>
      </div>
    </div>

    <section id="tab-agenda" style="padding:0">
      <div class="tools">
        <div class="daynav">
          <button class="mini" type="button" id="prevDay" aria-label="Dia anterior">←</button>
          <strong id="dayLabel"></strong>
          <button class="mini" type="button" id="nextDay" aria-label="Próximo dia">→</button>
        </div>
        <button class="mini" type="button" id="todayBtn">Hoje</button>
        <button class="mini" type="button" id="reload">Atualizar</button>
      </div>
      <p class="status" style="margin:0 0 14px">Toque em <b>Concluído</b> quando o cliente sair da cadeira: o selo entra sozinho no cartão dele.</p>
      <div class="list" id="bookings"></div>
    </section>

    <section id="tab-clientes" style="padding:0" hidden>
      <div class="tools">
        <input id="busca" placeholder="Buscar por nome ou WhatsApp" style="flex:1 1 260px">
      </div>
      <div class="tbl">
        <table class="cl">
          <thead><tr><th>Cliente</th><th>WhatsApp</th><th>Selos</th><th>Grátis usados</th><th></th></tr></thead>
          <tbody id="clientes"></tbody>
        </table>
      </div>
    </section>
  </div>
</main>
<div class="toast" id="toast" hidden></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="admin.js"></script>
</body>
</html>
